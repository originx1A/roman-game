[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 13:20 UTC is 09:20 in EDT. 14:20 UTC is 09:20 in EST.
# kit-daily-news sends on only the run whose Toronto clock is 09:20 or later in that hour.
[functions."kit-daily-news"]
  schedule = "20 13,14 * * *"

# `netlify dev` serves dist plus these functions. Run `npm run build` first.
# Plain `npm run dev` has no functions; the shop then says purchases are unavailable.

# Owner page and API answers are never indexed (no listing of the owner path in robots.txt or the sitemap)
[[headers]]
  for = "/roman-owner"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Payment API before the single-page fallback. Static hosts ignore this file.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# The live rule is public/_redirects. Netlify applies that file first, so this
# copy never runs while /* -> /index.html is in _redirects. Kept so the toml
# still names the route.
[[redirects]]
  from = "/news/feed.xml"
  to = "/.netlify/functions/news-feed"
  status = 200
  force = true

# 200 rewrite, not a 3xx. Share links are / and /#challenge=… (hash stays in the browser).
# A redirect back to the bare root would send crawlers to the URL X already cached with no card.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep UI clean — no Netlify chrome over the game
[build.processing]
  skip_processing = false
