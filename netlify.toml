[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` serves dist plus these functions. Run `npm run build` first.
# Plain `npm run dev` has no functions; the shop then says purchases are unavailable.

# Payment API before the single-page fallback. Static hosts ignore this file.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Short share links (/c/<id>?s=2). Rewrite to the app shell so crawlers get the og tags.
# 200, not a 3xx, and before the /* fallback so the path is not sent somewhere else.
# The ?s= query stays on the browser URL (card cache bust). The hash is not part of this rule.
[[redirects]]
  from = "/c/*"
  to = "/index.html"
  status = 200

# 200 rewrite, not a 3xx. Share links are /?s=2 and /c/<id>?s=2 (hash stays in the browser).
# A redirect back to the bare root would send crawlers to the URL X already cached with no card.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep UI clean — no Netlify chrome over the game
[build.processing]
  skip_processing = false
