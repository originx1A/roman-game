[[redirects]]
  from = "/api/cart"
  to = "/.netlify/functions/cart"
  status = 200
  force = true

# Payment API before the single-page fallback. Static hosts ignore this file.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# The live rule is public/_redirects. Netlify applies that file first, so this
# copy never runs while /* -> /index.html is in _redirects. Kept so the toml
# still names the route.
[[redirects]]
  from = "/news/feed.xml"
  to = "/.netlify/functions/news-feed"
  status = 200
  force = true

# 200 rewrite, not a 3xx. Share links are / and /#challenge=… (hash stays in the browser).
# A redirect back to the bare root would send crawlers to the URL X already cached with no card.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep UI clean — no Netlify chrome over the game
[build.processing]
  skip_processing = false
