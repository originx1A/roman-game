[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 13:20 UTC is 09:20 in EDT. 14:20 UTC is 09:20 in EST.
# kit-daily-news sends on only the run whose Toronto clock is 09:20 or later in that hour.
[functions."kit-daily-news"]
  schedule = "20 13,14 * * *"

# `netlify dev` serves dist plus these functions. Run `npm run build` first.
# Plain `npm run dev` has no functions; the shop then says purchases are unavailable.

# Owner page and API answers are never indexed (no listing of the owner path in robots.txt or the sitemap)
[[headers]]
  for = "/roman-owner"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Name+password auth. These must sit above /api/* because the first match wins
# and the splat would look for a function named auth/signup.
[[redirects]]
  from = "/api/auth/signup"
  to = "/.netlify/functions/auth-signup"
  status = 200
  force = true
[[redirects]]
  from = "/api/auth/signin"
  to = "/.netlify/functions/auth-signin"
  status = 200
  force = true
[[redirects]]
