name: Generate Roman voice MP3s

on:
  workflow_dispatch:
  push:
    branches: [cursor/ux-voice-blob-header-8810]
    paths:
      - 'scripts/generate-voices.py'
      - '.github/workflows/generate-roman-voices.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/ux-voice-blob-header-8810

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts
        run: python3 -m pip install edge-tts -q

      - name: Generate all voice clips
        run: python3 scripts/generate-voices.py

      - name: Commit and push MP3s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/voices/*.mp3
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Regenerate Roman voice MP3s with rougher edge-tts settings"
          git push
