name: Sync clean payloads
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-clean-payload.yml'
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch clean payloads from fix branch
        run: |
          set -euo pipefail
          mkdir -p scripts/payload
          BASE=https://raw.githubusercontent.com/originx1A/roman-game/cursor/fix-payload-gz-8810/scripts/payload
          for f in App.tsx.gz.b64 App.css.gz.b64 App.tsx.sha256 App.css.sha256; do
            curl -fsSL "$BASE/$f" -o "scripts/payload/$f"
          done
          printf '%s\n' 'inflate-ready-binary-gz-v1' > scripts/payload/INFLATE_READY.txt
          find scripts/payload -type f ! -name 'App.tsx.gz.b64' ! -name 'App.css.gz.b64' ! -name 'App.tsx.sha256' ! -name 'App.css.sha256' ! -name 'INFLATE_READY.txt' -delete
          ls -la scripts/payload
          wc -c scripts/payload/*
      - name: Commit clean payload tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/payload
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m "fix main: clean single-file gz.b64 payloads only"
            git push origin HEAD:main
          fi
