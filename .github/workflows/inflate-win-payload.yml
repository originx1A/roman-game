name: Inflate win payloads
on:
  push:
    paths:
      - 'scripts/payload/**'
      - 'scripts/inflate-win-payload.mjs'
      - 'scripts/pack-win-payload.mjs'
      - '.github/workflows/inflate-win-payload.yml'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Inflate payloads
        run: node scripts/inflate-win-payload.mjs
      - name: Commit restored App sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/App.css
          if git diff --cached --quiet; then
            echo "sources already up to date"
          else
            git commit -m "Inflate App.tsx/App.css from clean gzip payloads"
            git push origin HEAD:${{ github.ref_name }}
          fi
