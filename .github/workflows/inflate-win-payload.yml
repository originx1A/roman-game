name: Inflate win payloads
on:
  push:
    paths:
      - 'scripts/payload/**'
      - 'scripts/inflate-win-payload.mjs'
      - 'scripts/assemble-b64-suffix.mjs'
      - 'scripts/upload-inflated.mjs'
      - '.github/workflows/inflate-win-payload.yml'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Assemble suffix chunks into single gzip-b64
        run: node scripts/assemble-b64-suffix.mjs
      - name: Commit assembled single-file payloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/payload/*.gz.b64 || true
          git add -u scripts/payload || true
          if ! git diff --cached --quiet; then
            git commit -m "Assemble clean single-file gzip-b64 payloads"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "nothing to commit"
          fi
      - name: Inflate payloads
        run: node scripts/inflate-win-payload.mjs
      - name: Upload via Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node scripts/upload-inflated.mjs
