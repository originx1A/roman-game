name: Inflate win payloads
on:
  push:
    paths:
      - 'scripts/payload/**'
      - 'scripts/inflate-win-payload.mjs'
      - 'scripts/pack-win-payload.mjs'
      - '.github/workflows/inflate-win-payload.yml'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Remove legacy payload shards
        run: |
          set -euo pipefail
          cd scripts/payload
          # legacy plaintext shards, numeric gzip b64 parts, suffixes, size tests
          rm -f App.tsx.[0-9].txt App.tsx.[0-9][0-9].txt \
                App.css.[0-9].txt App.css.[0-9][0-9].txt \
                App.tsx.gz.b64.[0-9] App.css.gz.b64.[0-9] \
                App.tsx.gz.b64.suffix App.css.gz.b64.suffix \
                App.tsx.gz.b64 App.css.gz.b64 \
                _size_test.txt
          rm -f ../assemble-b64-suffix.mjs || true
          echo "payload after cleanup:"
          ls -la
      - name: Inflate payloads
        run: node scripts/inflate-win-payload.mjs
      - name: Commit restored App sources and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/payload src/App.tsx src/App.css scripts/assemble-b64-suffix.mjs || true
          if git diff --cached --quiet; then
            echo "sources already up to date"
          else
            git commit -m "Inflate App sources and remove legacy payload shards"
            git push origin HEAD:${{ github.ref_name }}
          fi
