name: Inflate win payloads
on:
  push:
    paths:
      - 'scripts/payload/**'
      - 'scripts/inflate-win-payload.mjs'
      - '.github/workflows/inflate-win-payload.yml'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: node scripts/inflate-win-payload.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/App.css
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add full-screen animated win celebration with Roman sayings"
          git push
